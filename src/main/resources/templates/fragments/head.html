<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="utf-8">
    <title>BISWELL</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Free HTML Templates" name="keywords">
    <meta content="Free HTML Templates" name="description">

    <!-- Favicon -->
    <link rel="SHORTCUT ICON" th:href="@{/images/logo.png}" type="image/x-icon"/>
    <link rel="icon" th:href="@{/images/logo.png}" type="image/gif"/>

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/js/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/css/style.css}" rel="stylesheet">

    <style>
        /* ===== Glassmorphism Loader (các trang khác index) ===== */
        #page-loader {
            position: fixed; inset: 0;
            background: rgba(220, 240, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 20px;
            padding: 36px 52px;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
            box-shadow: 0 8px 32px rgba(0, 174, 239, 0.14), 0 2px 10px rgba(0, 0, 0, 0.06);
        }
        .glass-spinner {
            width: 46px; height: 46px;
            border: 4px solid rgba(0, 174, 239, 0.18);
            border-top-color: #00AEEF;
            border-radius: 50%;
            animation: glass-spin 0.75s linear infinite;
        }
        @keyframes glass-spin { to { transform: rotate(360deg); } }
        .glass-text {
            color: #00AEEF;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            letter-spacing: 0.4px;
        }

        /* ===== Lottie Loader (index) ===== */
        #lottie-loader {
            position: fixed; inset: 0;
            background: #ffffff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
</html>
