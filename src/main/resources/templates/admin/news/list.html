<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-head::head}"></head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/admin-sidebar::sidebar}" th:with="activePage='news'"></div>

    <div class="admin-main">
        <div th:replace="~{admin/fragments/admin-topbar::topbar}" th:with="pageTitle='Quản lý Tin tức'"></div>

        <div class="admin-content">

            <!-- Flash messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
            </div>

            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Danh sách tin tức</span>
                    <a th:href="@{/admin/news/add}" class="btn btn-primary btn-sm">
                        <i class="fas fa-plus mr-1"></i> Thêm tin tức
                    </a>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th style="width: 60px;">Ảnh</th>
                                <th>Tiêu đề</th>
                                <th>Tóm tắt</th>
                                <th style="width: 160px;">Ngày tạo</th>
                                <th style="width: 130px;" class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(articles)}">
                                <td colspan="5" class="text-center py-4 text-muted">Chưa có tin tức nào</td>
                            </tr>
                            <tr th:each="article : ${articles}">
                                <td>
                                    <img th:if="${article.thumbnail}"
                                         th:src="${article.thumbnail}"
                                         style="width: 48px; height: 48px; object-fit: cover; border-radius: 4px;">
                                    <div th:unless="${article.thumbnail}"
                                         style="width: 48px; height: 48px; background: #e9ecef; border-radius: 4px; display: flex; align-items: center; justify-content: center;">
                                        <i class="fas fa-image text-muted"></i>
                                    </div>
                                </td>
                                <td>
                                    <span th:text="${article.articleName}" class="font-weight-500"
                                          style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"></span>
                                </td>
                                <td>
                                    <small class="text-muted"
                                           th:text="${article.summary != null ? #strings.abbreviate(article.summary, 80) : '—'}"></small>
                                </td>
                                <td>
                                    <small class="text-muted"
                                           th:text="${article.createAt != null ? #temporals.format(article.createAt, 'dd/MM/yyyy HH:mm') : '—'}"></small>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/news/{id}/edit(id=${article.articleId})}"
                                       class="btn btn-outline-primary btn-sm mr-1" title="Sửa">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <form th:action="@{/admin/news/{id}/delete(id=${article.articleId})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Xác nhận xóa tin tức này?')">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Xóa">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="card-footer bg-white" th:if="${totalPages > 1}">
                    <nav>
                        <ul class="pagination pagination-sm justify-content-center mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/news(page=${currentPage - 1})}">
                                    <i class="fas fa-chevron-left"></i>
                                </a>
                            </li>
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/admin/news(page=${i})}"
                                   th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/admin/news(page=${currentPage + 1})}">
                                    <i class="fas fa-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
</body>
</html>
