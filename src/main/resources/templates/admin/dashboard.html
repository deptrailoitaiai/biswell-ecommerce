<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/admin-head :: head}"></head>
<body>
<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/admin-sidebar :: sidebar}"></div>
    <div class="admin-main">
        <div th:replace="~{admin/fragments/admin-topbar :: topbar(pageTitle='Dashboard')}"></div>
        <div class="admin-content">

            <!-- Stats row -->
            <div class="row mb-4">
                <div class="col-md-3 col-6 mb-3">
                    <div class="card">
                        <div class="card-body d-flex align-items-center" style="gap: 16px;">
                            <div style="width:48px;height:48px;border-radius:50%;background:#e3f5fd;display:flex;align-items:center;justify-content:center;">
                                <i class="fas fa-box" style="color:#00AEEF;font-size:20px;"></i>
                            </div>
                            <div>
                                <div style="font-size:24px;font-weight:700;color:#1e2a3a;" th:text="${totalProducts}">0</div>
                                <div style="font-size:12px;color:#6c757d;">Sản phẩm</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-6 mb-3">
                    <div class="card">
                        <div class="card-body d-flex align-items-center" style="gap: 16px;">
                            <div style="width:48px;height:48px;border-radius:50%;background:#fff3e0;display:flex;align-items:center;justify-content:center;">
                                <i class="fas fa-tags" style="color:#ff9800;font-size:20px;"></i>
                            </div>
                            <div>
                                <div style="font-size:24px;font-weight:700;color:#1e2a3a;" th:text="${totalCategories}">0</div>
                                <div style="font-size:12px;color:#6c757d;">Danh mục</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-6 mb-3">
                    <div class="card">
                        <div class="card-body d-flex align-items-center" style="gap: 16px;">
                            <div style="width:48px;height:48px;border-radius:50%;background:#e8f5e9;display:flex;align-items:center;justify-content:center;">
                                <i class="fas fa-newspaper" style="color:#43a047;font-size:20px;"></i>
                            </div>
                            <div>
                                <div style="font-size:24px;font-weight:700;color:#1e2a3a;" th:text="${totalArticles}">0</div>
                                <div style="font-size:12px;color:#6c757d;">Tin tức</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 col-6 mb-3">
                    <div class="card">
                        <div class="card-body d-flex align-items-center" style="gap: 16px;">
                            <div style="width:48px;height:48px;border-radius:50%;background:#fce4ec;display:flex;align-items:center;justify-content:center;">
                                <i class="fas fa-images" style="color:#e91e63;font-size:20px;"></i>
                            </div>
                            <div>
                                <div style="font-size:24px;font-weight:700;color:#1e2a3a;">—</div>
                                <div style="font-size:12px;color:#6c757d;">Albums</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick actions -->
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">Thao tác nhanh</div>
                        <div class="card-body d-flex flex-wrap" style="gap: 12px;">
                            <a th:href="@{/admin/products/add}" class="btn btn-primary btn-sm">
                                <i class="fas fa-plus mr-1"></i>Thêm sản phẩm
                            </a>
                            <a th:href="@{/admin/categories/add}" class="btn btn-warning btn-sm">
                                <i class="fas fa-plus mr-1"></i>Thêm danh mục
                            </a>
                            <a th:href="@{/admin/news/add}" class="btn btn-success btn-sm">
                                <i class="fas fa-plus mr-1"></i>Thêm tin tức
                            </a>
                            <a th:href="@{/}" target="_blank" class="btn btn-outline-secondary btn-sm ml-auto">
                                <i class="fas fa-external-link-alt mr-1"></i>Xem website
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Latest products -->
            <div class="card">
                <div class="card-header d-flex align-items-center justify-content-between">
                    <span>Sản phẩm mới nhất</span>
                    <a th:href="@{/admin/products}" class="btn btn-sm btn-outline-primary">Xem tất cả</a>
                </div>
                <div class="card-body p-0">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th style="width:60px;">Ảnh</th>
                                <th>Tên sản phẩm</th>
                                <th>Danh mục</th>
                                <th style="width:100px;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${latestProducts}">
                                <td>
                                    <img th:src="${p.mainImagePath != null} ? ${p.mainImagePath} : @{/img/default-product.png}"
                                         style="width:44px;height:44px;object-fit:cover;border-radius:6px;" alt="">
                                </td>
                                <td th:text="${p.pname}">—</td>
                                <td>
                                    <span class="badge badge-light" th:text="${p.category != null ? p.category.categoryName : '—'}">—</span>
                                </td>
                                <td>
                                    <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-xs btn-outline-secondary" style="font-size:12px;padding:2px 8px;">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(latestProducts)}">
                                <td colspan="4" class="text-center text-muted py-4">Chưa có sản phẩm nào</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
</body>
</html>
