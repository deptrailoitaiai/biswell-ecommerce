<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biswell Admin — Đăng nhập</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e2a3a 0%, #2d4060 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
            padding: 44px 40px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo img { height: 56px; }
        .login-logo p {
            font-size: 12px;
            color: #6c757d;
            margin: 8px 0 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .login-title {
            font-size: 20px;
            font-weight: 600;
            color: #1e2a3a;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group label { font-size: 13px; font-weight: 600; color: #495057; }
        .form-control {
            border-radius: 8px;
            height: 44px;
            font-size: 14px;
            border-color: #dee2e6;
        }
        .form-control:focus { border-color: #00AEEF; box-shadow: 0 0 0 3px rgba(0,174,239,0.15); }
        .input-group-text { border-radius: 0 8px 8px 0; background: #f8f9fa; border-color: #dee2e6; color: #6c757d; }
        .btn-login {
            background: #00AEEF;
            border: none;
            border-radius: 8px;
            height: 46px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
            width: 100%;
            color: #fff;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #0099d4; color: #fff; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { font-size: 13px; color: #6c757d; text-decoration: none; }
        .back-link a:hover { color: #00AEEF; }
        .toggle-pw { cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img th:src="@{/images/logo.png}" alt="Biswell">
            <p>Trang quản trị</p>
        </div>
        <h5 class="login-title">Đăng nhập</h5>

        <div th:if="${error}" class="alert alert-danger py-2" style="font-size: 13px; border-radius: 8px;">
            <i class="fas fa-exclamation-circle mr-1"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/admin/login}" method="post">
            <div class="form-group">
                <label>Tài khoản</label>
                <input type="text" name="username" class="form-control"
                       placeholder="Nhập tài khoản" autofocus required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-group">
                    <input type="password" name="password" id="passwordInput"
                           class="form-control" style="border-radius: 8px 0 0 8px;"
                           placeholder="Nhập mật khẩu" required>
                    <div class="input-group-append">
                        <span class="input-group-text toggle-pw" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                        </span>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-login mt-2">
                <i class="fas fa-sign-in-alt mr-2"></i>Đăng nhập
            </button>
        </form>

        <div class="back-link">
            <a th:href="@{/}"><i class="fas fa-arrow-left mr-1"></i>Về trang chủ</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
