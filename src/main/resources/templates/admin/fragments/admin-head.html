<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biswell Admin</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }

        .admin-wrapper { display: flex; min-height: 100vh; }

        .admin-sidebar {
            width: 240px;
            min-height: 100vh;
            background: #1e2a3a;
            color: #fff;
            flex-shrink: 0;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            overflow-y: auto;
        }
        .sidebar-brand {
            padding: 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-brand span { font-size: 18px; font-weight: 600; color: #fff; }
        .sidebar-menu { list-style: none; padding: 12px 0; margin: 0; }
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .sidebar-menu li a:hover,
        .sidebar-menu li a.active { color: #fff; background: rgba(255,255,255,0.1); }
        .sidebar-menu li a i { width: 18px; text-align: center; }
        .sidebar-menu .divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 8px 0; }

        .admin-main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; }

        .admin-topbar {
            background: #fff;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid #e9ecef;
            position: sticky;
            top: 0;
            z-index: 100;
            justify-content: space-between;
        }
        .admin-topbar .page-title { font-size: 16px; font-weight: 600; color: #1e2a3a; margin: 0; }
        .admin-topbar .topbar-right { display: flex; align-items: center; gap: 12px; font-size: 14px; color: #6c757d; }

        .admin-content { padding: 24px; }

        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-radius: 8px; }
        .card-header { background: #fff; border-bottom: 1px solid #f0f0f0; font-weight: 600; padding: 16px 20px; }
        .table thead th { border-top: none; background: #f8f9fa; font-size: 13px; font-weight: 600; color: #495057; }
        .table td { vertical-align: middle; font-size: 14px; }

        .badge-pill { padding: 4px 10px; font-size: 12px; }
        .page-item.active .page-link { background-color: #1e2a3a; border-color: #1e2a3a; }
        .page-link { color: #1e2a3a; }
    </style>
</head>
</html>
