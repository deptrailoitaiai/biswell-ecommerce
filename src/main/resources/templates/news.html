<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head::head}"></head>

<body>

    <div th:replace="~{fragments/header::header}"></div>
    <div th:replace="~{fragments/navbar::navbar}"></div>

    <!-- Page Header Start -->
    <div class="container-fluid bg-secondary mb-5">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 300px">
            <h1 class="font-weight-semi-bold text-uppercase mb-3">Tin tức</h1>
            <div class="d-inline-flex">
                <p class="m-0"><a th:href="@{/}">Trang chủ</a></p>
                <p class="m-0 px-2">-</p>
                <p class="m-0">Tin tức</p>
            </div>
        </div>
    </div>
    <!-- Page Header End -->


    <!-- News List Start -->
    <div class="container-fluid pt-5">
        <div class="row px-xl-5 pb-3">

            <!-- Empty state -->
            <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(newsList)}">
                <i class="fas fa-newspaper fa-3x text-muted mb-3 d-block"></i>
                <p class="text-muted">Chưa có tin tức nào.</p>
            </div>

            <!-- News cards -->
            <div class="col-lg-4 col-md-6 col-sm-12 pb-1"
                 th:each="article : ${newsList}">
                <div class="card product-item border-0 mb-4">

                    <!-- Thumbnail -->
                    <div class="card-header product-img position-relative overflow-hidden bg-transparent border p-0">
                        <a th:href="@{/news/{id}(id=${article.articleId})}">
                            <img th:if="${article.thumbnail}"
                                 th:src="${article.thumbnail}"
                                 class="img-fluid w-100"
                                 style="height: 200px; object-fit: cover;"
                                 alt="">
                            <div th:unless="${article.thumbnail}"
                                 class="img-fluid w-100 d-flex align-items-center justify-content-center bg-secondary"
                                 style="height: 200px;">
                                <i class="fas fa-newspaper fa-3x text-muted"></i>
                            </div>
                        </a>
                    </div>

                    <!-- Title + date -->
                    <div class="card-body border-left border-right text-center p-0 pt-4 pb-3">
                        <small class="text-muted d-block mb-2">
                            <i class="far fa-clock mr-1"></i>
                            <span th:text="${article.createAt != null ? #temporals.format(article.createAt, 'dd/MM/yyyy') : ''}"></span>
                        </small>
                        <h6 class="mb-2 px-3"
                            style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                            th:text="${article.articleName}"></h6>
                        <p class="text-muted px-3 mb-0"
                           style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px;"
                           th:text="${article.summary ?: ''}"></p>
                    </div>

                    <!-- Action -->
                    <div class="card-footer d-flex justify-content-center bg-light border">
                        <a th:href="@{/news/{id}(id=${article.articleId})}"
                           class="btn btn-sm text-dark p-0">
                            <i class="fas fa-eye text-primary mr-1"></i>
                            Xem chi tiết
                        </a>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="col-12 pb-1" th:if="${totalPages > 1}">
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center mb-3">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/news(page=${currentPage - 1})}"
                               aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            class="page-item"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                               th:href="@{/news(page=${i})}"
                               th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link"
                               th:href="@{/news(page=${currentPage + 1})}"
                               aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
    <!-- News List End -->


    <div th:replace="~{fragments/footer::footer}"></div>

    <!-- Back to Top -->
    <a href="#" class="btn btn-primary back-to-top"><i class="fa fa-angle-double-up"></i></a>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/lib/easing/easing.min.js}"></script>
    <script th:src="@{/js/lib/owlcarousel/owl.carousel.min.js}"></script>
    <script th:src="@{/js/mail/jqBootstrapValidation.min.js}"></script>
    <script th:src="@{/js/mail/contact.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
