services:
  mysql:
    image: mysql:8
    container_name: biswell-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: S0nTay7991@
      MYSQL_DATABASE: biswell
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql   # 👈 QUAN TRỌNG

  app:
    build: .
    container_name: biswell-app
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/biswell
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: S0nTay7991@

volumes:
  mysql_data: